name: CD Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Binaries
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            artifact_name: goslide_linux_amd64
          - os: linux
            arch: arm64
            artifact_name: goslide_linux_arm64
          - os: darwin
            arch: amd64
            artifact_name: goslide_darwin_amd64
          - os: darwin
            arch: arm64
            artifact_name: goslide_darwin_arm64
          - os: windows
            arch: amd64
            artifact_name: goslide_windows_amd64
          - os: windows
            arch: arm64
            artifact_name: goslide_windows_arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Set up Node.js for Web Bundle
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd web
          npm ci

      - name: Build and Package Binary via Makefile
        run: |
          make package GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} ARTIFACT_NAME=${{ matrix.artifact_name }} VERSION=${{ github.ref_name }}

      - name: Upload Artifact to Job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.*

  publish:
    name: Publish to GitHub Releases
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd release-artifacts
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/checksums.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
