name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Web Dependencies & Build Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Cross-Build All 6 Platform Binaries & Checksums
        run: |
          make cross-build VERSION=${{ github.ref_name }}

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          python3 -c "
          import re, sys
          tag = '${{ github.ref_name }}'.lstrip('v')
          try:
              content = open('CHANGELOG.md').read()
              pattern = r'## \[(?:v)?' + re.escape(tag) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  open('release_notes.md', 'w').write(match.group(1).strip())
              else:
                  open('release_notes.md', 'w').write('Release ${{ github.ref_name }}')
          except Exception as e:
              open('release_notes.md', 'w').write('Release ${{ github.ref_name }}')
          "

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: dist/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
