<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two Columns Layout Test</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <style id="goslide-theme-styles">
/* --- Base Styles --- */
/* Goslide Deck Canvas Stylesheet
 * 16:9 Presentation Viewport, PPT Master 4-Tier Structural Isolation, and Semantic Layouts
 */

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #0b0f19;
  color: #f8fafc;
  font-size: 28px;
  word-break: keep-all;
  overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
}

/* Presentation Stage: Fullscreen center container */
.goslide-stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

body.sidebar-open .goslide-stage {
  width: calc(100vw - 480px);
}

/* 16:9 Deck Frame: Physical Fixed 1920x1080 */
.goslide-deck {
  width: 1920px;
  height: 1080px;
  position: relative;
  flex-shrink: 0;
}

/* Slide Wrapper & Frame (Legacy/Preview fallback) */
.slide-wrapper {
  position: relative;
  width: 1920px;
  height: 1080px;
  flex-shrink: 0;
}

.slide-badge {
  position: absolute;
  top: -1.6rem;
  left: 0.5rem;
  font-size: 0.75rem;
  color: #94a3b8;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

/* 16:9 Slide Canvas: Physical Fixed 1920x1080 Dimension */
.slide-card {
  width: 1920px !important;
  height: 1080px !important;
  min-width: 1920px !important;
  max-width: 1920px !important;
  min-height: 1080px !important;
  max-height: 1080px !important;
  position: absolute;
  top: 0;
  left: 0;
  overflow: hidden;
  padding: 0 !important;
  display: flex !important;
  visibility: hidden !important;
  opacity: 0 !important;
  pointer-events: none !important;
  z-index: 0;
  flex-direction: column !important;
  flex-shrink: 0;
  box-sizing: border-box;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  border-radius: 0;
}

.slide-card.active {
  visibility: visible !important;
  opacity: 1 !important;
  pointer-events: auto !important;
  z-index: 10;
}

/* 1:1 Transparent Annotation Canvas */
.goslide-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 2000;
  pointer-events: none;
}

body.drawing-mode {
  user-select: none;
  -webkit-user-select: none;
}

/* Floating Progress Indicator */
.goslide-indicator {
  position: fixed;
  bottom: 1.25rem;
  right: 1.5rem;
  background-color: rgba(15, 23, 42, 0.75);
  color: #94a3b8;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.85rem;
  padding: 0.35rem 0.75rem;
  border-radius: 9999px;
  backdrop-filter: blur(4px);
  z-index: 3000;
  user-select: none;
  transition: all 0.2s ease;
  pointer-events: none;
}

.goslide-indicator.pen-active {
  background-color: rgba(239, 68, 68, 0.9);
  color: #ffffff;
  box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
}

/* --------------------------------------------------------------------------
   PPT 4-Tier Master Structure: Fixed 1920x1080
   40px (Tracker) + 120px (Title) + 840px (Body) + 80px (Footer) = 1080px
   -------------------------------------------------------------------------- */

/* 1. Running Header / Tracker (Height: 40px) */
.slide-header,
.slide-tracker {
  flex: 0 0 40px;
  height: 40px;
  box-sizing: border-box;
  padding: 16px 80px 0 80px;
  font-size: 0.75rem;
  line-height: 1.4;
  opacity: 0.6;
  text-align: left !important; /* 커버/섹션 상속 방어 */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  position: static;
  z-index: 10;
}

/* 2. Slide Title Placeholder Box (Height: 120px) */
.slide-title-box {
  flex: 0 0 120px;
  height: 120px;
  box-sizing: border-box;
  padding: 10px 80px;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  text-align: left !important;
  position: static;
  z-index: 10;
}

.slide-title-box h1,
.slide-title-box h2 {
  margin: 0;
  font-size: 2.25rem;
  line-height: 1.2;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 3. Slide Content / Body Placeholder Box (Height: 840px) */
.slide-body,
.slide-content-box {
  flex: 0 0 840px;
  height: 840px;
  min-height: 840px;
  max-height: 840px;
  box-sizing: border-box;
  padding: 20px 80px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  position: relative;
  z-index: 1;
}

/* 4. Slide Footer (Height: 80px) */
.slide-footer {
  flex: 0 0 80px;
  height: 80px;
  box-sizing: border-box;
  padding: 0 80px 24px 80px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.75rem;
  opacity: 0.65;
  position: static;
  z-index: 10;
}

.slide-header:empty,
.slide-tracker:empty,
.slide-title-box:empty,
.slide-footer:empty {
  border: none !important;
}

/* Semantic Layouts */
.slide-card.cover,
.slide-card.layout-cover {
  text-align: center;
}

.slide-card.cover .slide-header,
.slide-card.cover .slide-tracker,
.slide-card.cover .slide-title-box,
.slide-card.layout-cover .slide-header,
.slide-card.layout-cover .slide-tracker,
.slide-card.layout-cover .slide-title-box {
  display: none !important;
}

.slide-card.cover .slide-body,
.slide-card.layout-cover .slide-body {
  flex: 0 0 1000px;
  height: 1000px;
  min-height: 1000px;
  max-height: 1000px;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.slide-card.cover h1,
.slide-card.layout-cover h1 {
  font-size: 3rem;
  margin-bottom: 1rem;
  line-height: 1.2;
}

.slide-card.cover p,
.slide-card.layout-cover p {
  font-size: 1.3rem;
  margin: 0.5rem 0;
  opacity: 0.85;
}

.slide-card.section,
.slide-card.layout-section {
  text-align: center;
}

.slide-card.section .slide-header,
.slide-card.section .slide-tracker,
.slide-card.section .slide-title-box,
.slide-card.layout-section .slide-header,
.slide-card.layout-section .slide-tracker,
.slide-card.layout-section .slide-title-box {
  display: none !important;
}

.slide-card.section .slide-body,
.slide-card.layout-section .slide-body {
  flex: 0 0 1000px;
  height: 1000px;
  min-height: 1000px;
  max-height: 1000px;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.slide-card.section h1,
.slide-card.section h2,
.slide-card.layout-section h1,
.slide-card.layout-section h2 {
  font-size: 3.25rem;
  margin-top: 0;
  margin-bottom: 1.5rem;
  line-height: 1.2;
}

.slide-card.section h3,
.slide-card.layout-section h3,
.slide-card.section p,
.slide-card.layout-section p {
  font-size: 1.5rem;
  margin-top: 0;
  margin-bottom: 3.5rem;
  line-height: 1.5;
  opacity: 0.85;
}

/* List alignment in centered layouts (cover & section) */
.slide-card.cover ul,
.slide-card.cover ol,
.slide-card.layout-cover ul,
.slide-card.layout-cover ol {
  text-align: left;
  display: inline-block;
  margin-left: auto;
  margin-right: auto;
  max-width: 90%;
}

.slide-card.section ul,
.slide-card.section ol,
.slide-card.layout-section ul,
.slide-card.layout-section ol {
  text-align: left;
  display: inline-block;
  margin-left: auto;
  margin-right: auto;
  max-width: 85%;
  margin-top: 0.5rem;
}

.slide-card.cover li,
.slide-card.layout-cover li {
  text-align: left;
}

.slide-card.section li,
.slide-card.layout-section li {
  text-align: left;
  font-size: 1.35rem;
  line-height: 1.8;
  margin-bottom: 1.25rem;
}

.slide-card.section .slide-body > :last-child,
.slide-card.layout-section .slide-body > :last-child,
.slide-card.section li:last-child,
.slide-card.layout-section li:last-child {
  margin-bottom: 0 !important;
}

/* Cat 5: Quote / Callout Layout (Lead) */
.slide-card.lead .slide-title-box,
.slide-card.quote .slide-title-box,
.slide-card.layout-lead .slide-title-box,
.slide-card.layout-quote .slide-title-box {
  display: none !important;
}

.slide-card.lead .slide-body,
.slide-card.quote .slide-body,
.slide-card.lead .slide-content-box,
.slide-card.quote .slide-content-box,
.slide-card.layout-lead .slide-body,
.slide-card.layout-lead .slide-content-box,
.slide-card.layout-quote .slide-body,
.slide-card.layout-quote .slide-content-box {
  flex: 0 0 960px !important;
  height: 960px !important;
  min-height: 960px !important;
  max-height: 960px !important;
  justify-content: center !important;
  align-items: center !important;
  text-align: center !important;
  padding: 40px 140px !important;
}

.slide-card.lead h1,
.slide-card.quote h1,
.slide-card.layout-lead h1,
.slide-card.layout-quote h1 {
  font-size: 3.25rem !important;
  margin-bottom: 2rem !important;
  font-weight: 800 !important;
  line-height: 1.2 !important;
}

.slide-card.lead blockquote,
.slide-card.quote blockquote,
.slide-card.layout-lead blockquote,
.slide-card.layout-quote blockquote {
  font-size: 2rem !important;
  line-height: 1.6 !important;
  border-left: none !important;
  background: transparent !important;
  padding: 0 !important;
  font-style: italic !important;
}

/* Blank Layout */
.slide-card.blank,
.slide-card.layout-blank {
  padding: 0;
}

.slide-card.blank .slide-header,
.slide-card.blank .slide-tracker,
.slide-card.blank .slide-title-box,
.slide-card.blank .slide-footer,
.slide-card.layout-blank .slide-header,
.slide-card.layout-blank .slide-tracker,
.slide-card.layout-blank .slide-title-box,
.slide-card.layout-blank .slide-footer {
  display: none !important;
}

.slide-card.blank .slide-body,
.slide-card.layout-blank .slide-body {
  flex: 0 0 1080px;
  height: 1080px;
  min-height: 1080px;
  max-height: 1080px;
  padding: 0;
  justify-content: center;
  align-items: center;
}

/* Two Columns Layout (Scoped strictly inside slide-body) */
.slide-body .two-cols {
  display: flex !important;
  flex-direction: row !important;
  gap: 2.5rem;
  width: 100%;
  height: 100%;
}

.slide-body .two-cols .col-left,
.slide-body .two-cols .col-right {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* --------------------------------------------------------------------------
   Print & PDF Export Media Query (16:9 1920x1080 Zero-Margin Vector PDF)
   -------------------------------------------------------------------------- */
@media print {
  @page {
    size: 1920px 1080px;
    margin: 0;
  }

  html, body {
    width: 1920px !important;
    height: auto !important;
    min-height: 100% !important;
    overflow: visible !important;
    background: #000000 !important;
    margin: 0 !important;
    padding: 0 !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  .goslide-stage {
    width: 1920px !important;
    height: auto !important;
    min-height: auto !important;
    display: block !important;
    overflow: visible !important;
    transform: none !important;
    padding: 0 !important;
    margin: 0 !important;
  }

  .goslide-deck {
    width: 1920px !important;
    height: auto !important;
    display: block !important;
    position: static !important;
    transform: none !important;
  }

  .slide-card {
    position: relative !important;
    top: auto !important;
    left: auto !important;
    width: 1920px !important;
    height: 1080px !important;
    min-width: 1920px !important;
    max-width: 1920px !important;
    min-height: 1080px !important;
    max-height: 1080px !important;
    display: flex !important;
    visibility: visible !important;
    opacity: 1 !important;
    pointer-events: auto !important;
    page-break-after: always !important;
    break-after: page !important;
    page-break-inside: avoid !important;
    break-inside: avoid !important;
    box-shadow: none !important;
    margin: 0 !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  .slide-card:last-child {
    page-break-after: avoid !important;
    break-after: avoid !important;
  }

  /* Hide interactive widgets and presenter controls during print */
  #goslide-app,
  .goslide-canvas,
  .goslide-indicator,
  .slide-badge,
  .slide-controls {
    display: none !important;
    visibility: hidden !important;
  }
}


/* Goslide Deck Content Stylesheet
 * Markdown Typography, Code Blocks, Tables, GFM Alerts, Dimming & Utility Presets
 */

/* Typography & Markdown Defaults */
h1, h2, h3, h4, h5, h6 {
  margin-top: 0;
  margin-bottom: 0.8rem;
  line-height: 1.25;
  font-weight: 700;
}

h1 { font-size: 2.25rem; }
h2 { font-size: 1.75rem; }
h3 { font-size: 1.35rem; }
h4 { font-size: 1.15rem; }
h5 { font-size: 1.0rem; font-weight: 600; margin-bottom: 0.5rem; }
h6 { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.8; }

p {
  margin-top: 0;
  margin-bottom: 1rem;
  line-height: 1.6;
}

ul, ol {
  margin-top: 0;
  margin-bottom: 1rem;
  padding-left: 1.75rem;
  line-height: 1.6;
  text-align: left;
}

li {
  margin-bottom: 0.4rem;
}

/* Nested lists spacing optimization */
li > ul, li > ol {
  margin-top: 0.25rem;
  margin-bottom: 0.25rem;
  padding-left: 1.4rem;
}

/* GFM Task List */
ul.contains-task-list {
  list-style: none;
  padding-left: 0.25rem;
}

li.task-list-item {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 0.5rem;
}

li.task-list-item input[type="checkbox"] {
  width: 1.15rem;
  height: 1.15rem;
  margin: 0;
  cursor: pointer;
  border-radius: 4px;
}

/* Strikethrough & Keyboard Caps */
del {
  opacity: 0.55;
  text-decoration: line-through;
}

kbd {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.82em;
  padding: 0.15rem 0.45rem;
  border-radius: 4px;
  background-color: rgba(148, 163, 184, 0.15);
  border: 1px solid rgba(148, 163, 184, 0.35);
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
}

blockquote {
  margin: 1rem 0;
  padding: 0.75rem 1.25rem;
  border-radius: 4px;
}

/* GFM Callouts / Alerts */
.markdown-alert {
  padding: 0.75rem 1.25rem;
  margin: 1rem 0;
  border-left: 4px solid #3b82f6;
  border-radius: 6px;
  background-color: rgba(148, 163, 184, 0.08);
}

.markdown-alert-note { border-left-color: #3b82f6; background-color: rgba(59, 130, 246, 0.08); }
.markdown-alert-tip { border-left-color: #10b981; background-color: rgba(16, 185, 129, 0.08); }
.markdown-alert-important { border-left-color: #8b5cf6; background-color: rgba(139, 92, 246, 0.08); }
.markdown-alert-warning { border-left-color: #f59e0b; background-color: rgba(245, 158, 11, 0.08); }
.markdown-alert-caution { border-left-color: #ef4444; background-color: rgba(239, 68, 68, 0.08); }

.markdown-alert-title {
  font-weight: 700;
  margin-top: 0;
  margin-bottom: 0.4rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.markdown-alert > :last-child {
  margin-bottom: 0;
}

pre {
  margin: 1rem 0;
  padding: 1rem 1.25rem;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 0.9rem;
  line-height: 1.45;
}

code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

table {
  border-collapse: collapse;
  width: 100%;
  margin: 1rem 0;
  font-size: 0.95rem;
}

th, td {
  padding: 0.6rem 1rem;
  text-align: left;
}

/* Table GFM Alignments Restoration */
.slide-card th[align="center"], .slide-card td[align="center"] { text-align: center !important; }
.slide-card th[align="right"],  .slide-card td[align="right"]  { text-align: right !important; }
.slide-card th[align="left"],   .slide-card td[align="left"]   { text-align: left !important; }

img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

img.img-center {
  display: block;
  margin-left: auto;
  margin-right: auto;
}

/* Background Dimming Overlay */
.slide-card.has-bg-dim {
  position: relative;
}

.slide-bg-dim {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

.slide-card > *:not(.slide-bg-dim) {
  position: relative;
  z-index: 2;
}

.slide-card[style*="color:"] h1,
.slide-card[style*="color:"] h2,
.slide-card[style*="color:"] h3,
.slide-card[style*="color:"] h4,
.slide-card[style*="color:"] h5,
.slide-card[style*="color:"] h6 {
  color: inherit;
}

/* Slide Utility Classes & Presets */
/* Slide Title Invariant: 슬라이드 제목은 compact/dense 여부와 무관하게 2.25rem 일관 고정 */
.slide-card .slide-title-box h1,
.slide-card .slide-title-box h2 {
  font-size: 2.25rem !important;
  line-height: 1.2;
}

/* compact / small: 본문(slide-body) 영역의 텍스트, 코드 블록, 테이블을 정밀 축소 */
.slide-card.compact .slide-body,
.slide-card.small .slide-body {
  font-size: 0.88rem;
}
.slide-card.compact .slide-body h3,
.slide-card.small .slide-body h3 { font-size: 1.2rem; }
.slide-card.compact .slide-body h4,
.slide-card.small .slide-body h4 { font-size: 1.05rem; }
.slide-card.compact .slide-body pre,
.slide-card.small .slide-body pre { padding: 0.75rem 1rem; font-size: 0.82rem; }
.slide-card.compact .slide-body table,
.slide-card.small .slide-body table { font-size: 0.82rem; }

/* dense: 많은 양의 데이터/코드를 수용하기 위한 고밀도 본문 축소 */
.slide-card.dense .slide-body {
  font-size: 0.8rem;
}
.slide-card.dense .slide-body h3 { font-size: 1.1rem; }
.slide-card.dense .slide-body h4 { font-size: 0.95rem; }
.slide-card.dense .slide-body pre {
  font-size: 0.72rem;
  line-height: 1.35;
  padding: 0.6rem 0.8rem;
}
.slide-card.dense .slide-body table {
  font-size: 0.75rem;
}

.slide-card.lead {
  justify-content: center !important;
  align-items: center !important;
  text-align: center !important;
  font-size: 1.4rem;
}

.slide-card.lead h1 {
  font-size: 3.25rem;
  margin-bottom: 1.5rem;
}

.slide-card.lead p {
  font-size: 1.5rem;
  line-height: 1.6;
}

/* Mermaid Diagrams: 슬라이드 폭 기준 자동 반응형 핏 & 모던 카드 UI 테마 */
.slide-card .mermaid,
.slide-card pre.mermaid {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  max-height: 100%;
  margin: 1.25rem auto;
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  padding: 0 !important;
  text-align: center;
}

.slide-card .mermaid svg,
.slide-card pre.mermaid svg {
  max-width: 100% !important;
  max-height: 100% !important;
  height: auto !important;
}

/* 1. 모던 카드 박스: 둥근 모서리, 부드러운 배경 및 그림자 */
.slide-card .mermaid .node rect,
.slide-card .mermaid .node polygon {
  rx: 10px !important;
  ry: 10px !important;
  stroke: #818cf8 !important;
  stroke-width: 1.5px !important;
  fill: #f8faff !important;
  filter: drop-shadow(0 4px 12px rgba(99, 102, 241, 0.08)) !important;
}

/* 2. 연결선 및 화살표: 인디고 블루 톤과 유려한 두께 */
.slide-card .mermaid .flowchart-link {
  stroke: #6366f1 !important;
  stroke-width: 2px !important;
}
.slide-card .mermaid .marker {
  fill: #6366f1 !important;
  stroke: #6366f1 !important;
}

/* 3. 타이포그래피: 본문 폰트 계층화 및 가독성 */
.slide-card .mermaid .nodeLabel {
  font-family: inherit !important;
  color: #1e293b !important;
  letter-spacing: -0.01em;
}

.slide-card .mermaid .edgeLabel {
  background-color: #f1f5f9 !important;
  border-radius: 6px !important;
  padding: 2px 6px !important;
  color: #475569 !important;
  font-size: 0.85em !important;
}

/* 4. 다크 모드 자동 대응 */
.slide-card.dark .mermaid .node rect,
.slide-card.dark .mermaid .node polygon,
.slide-card.invert .mermaid .node rect,
.slide-card.invert .mermaid .node polygon {
  fill: #1e293b !important;
  stroke: #6366f1 !important;
  filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.35)) !important;
}
.slide-card.dark .mermaid .nodeLabel,
.slide-card.invert .mermaid .nodeLabel {
  color: #f1f5f9 !important;
}
.slide-card.dark .mermaid .flowchart-link,
.slide-card.invert .mermaid .flowchart-link {
  stroke: #818cf8 !important;
}
.slide-card.dark .mermaid .marker,
.slide-card.invert .mermaid .marker {
  fill: #818cf8 !important;
  stroke: #818cf8 !important;
}
.slide-card.dark .mermaid .node .katex path,
.slide-card.invert .mermaid .node .katex path {
  fill: #f1f5f9 !important;
  stroke: #f1f5f9 !important;
}
.slide-card.dark .mermaid .node .katex,
.slide-card.invert .mermaid .node .katex {
  color: #f1f5f9 !important;
}

/* --------------------------------------------------------------------------
   YouTube Media Embed Component (16:9 Full Center Focus: 1200x675)
   -------------------------------------------------------------------------- */
.goslide-youtube-wrapper {
  margin: 0.75rem auto;
  width: 100%;
  max-width: 1200px;
  text-align: center;
  box-sizing: border-box;
}

.goslide-youtube-title {
  font-size: 1.25rem;
  font-weight: 600;
  margin-top: 0.75rem;
  opacity: 0.9;
  text-align: center;
  color: inherit;
}

.goslide-youtube-link {
  display: block;
  position: relative;
  width: 100%;
  text-decoration: none;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
}

.goslide-youtube-poster {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 20px 48px rgba(0, 0, 0, 0.4);
  background-color: #000000;
  display: flex;
  align-items: center;
  justify-content: center;
}

.goslide-youtube-thumb {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease, filter 0.3s ease;
}

.goslide-youtube-link:hover .goslide-youtube-thumb {
  transform: scale(1.02);
  filter: brightness(0.88);
}

.goslide-youtube-play-btn {
  position: absolute;
  z-index: 2;
  width: 72px;
  height: 50px;
  pointer-events: none;
  transition: transform 0.3s ease, filter 0.3s ease;
  filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
}

.goslide-youtube-link:hover .goslide-youtube-play-btn {
  transform: scale(1.15);
  filter: drop-shadow(0 6px 20px rgba(255, 0, 0, 0.65));
}

.goslide-youtube-play-icon {
  width: 100%;
  height: 100%;
  display: block;
}

.goslide-youtube-play-icon .play-bg {
  fill: #ff0000;
  transition: fill 0.2s ease;
}

.goslide-youtube-link:hover .goslide-youtube-play-icon .play-bg {
  fill: #cc0000;
}

.goslide-youtube-play-icon .play-arrow {
  fill: #ffffff;
}

/* Two-column layout adaptation */
.two-cols .goslide-youtube-wrapper {
  max-width: 100%;
  margin: 0.5rem auto;
}

body {
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
}

.slide-card {
  background-color: #ffffff;
  color: #1e293b;
  border: 1px solid #e2e8f0;
}

/* Headings */
.slide-card h1 {
  color: #0f172a;
  letter-spacing: -0.025em;
}

.slide-card h2 {
  color: #1e293b;
  letter-spacing: -0.02em;
}

.slide-card h3,
.slide-card h4 {
  color: #334155;
}

/* Links & Accents */
.slide-card a {
  color: #2563eb;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.slide-card strong {
  color: #0f172a;
  font-weight: 700;
}

/* Header & Footer */
.slide-card .slide-header {
  color: #64748b;
  border-bottom: 1px solid #f1f5f9;
  padding-bottom: 0.4rem;
}

.slide-card .slide-footer {
  color: #64748b;
  border-top: 1px solid #f1f5f9;
  padding-top: 0.4rem;
}

/* Blockquote */
.slide-card blockquote {
  background-color: #f8fafc;
  border-left: 4px solid #2563eb;
  color: #475569;
}

/* Code Blocks & Inline Code */
.slide-card pre {
  background-color: #f8fafc;
  border: 1px solid #e2e8f0;
  color: #0f172a;
}

.slide-card :not(pre) > code {
  background-color: #f1f5f9;
  color: #db2777;
  padding: 0.2rem 0.4rem;
  border-radius: 4px;
  font-size: 0.9em;
}

/* Tables */
.slide-card table {
  border: 1px solid #e2e8f0;
}

.slide-card th {
  background-color: #f8fafc;
  color: #0f172a;
  font-weight: 600;
  border-bottom: 2px solid #cbd5e1;
}

.slide-card td {
  border-bottom: 1px solid #e2e8f0;
  color: #334155;
}

.slide-card tr:nth-child(even) td {
  background-color: #fafbfd;
}

/* Cover & Section Layout Overrides */
.slide-card.cover h1 {
  color: #1d4ed8;
}

.slide-card.section {
  background-color: #0f172a;
  color: #f8fafc;
  border-color: #1e293b;
}

.slide-card.section h1,
.slide-card.section h2 {
  color: #60a5fa;
}

.slide-card.section p {
  color: #94a3b8;
}

/* Invert Utility Class */
.slide-card.invert {
  background-color: #0f172a;
  color: #f8fafc;
}

.slide-card.invert h1,
.slide-card.invert h2,
.slide-card.invert h3,
.slide-card.invert h4,
.slide-card.invert h5,
.slide-card.invert h6 {
  color: #60a5fa;
}

.slide-card.invert .slide-header,
.slide-card.invert .slide-footer {
  color: #94a3b8;
  border-color: #1e293b;
}

.slide-card.invert pre {
  background-color: #1e293b;
  border-color: #334155;
  color: #f8fafc;
}

.slide-card.invert kbd {
  background-color: #1e293b;
  border-color: #475569;
  color: #f8fafc;
}

.slide-card.invert table {
  border-color: #334155;
}

.slide-card.invert th {
  color: #60a5fa;
  border-bottom-color: #334155;
}

.slide-card.invert td {
  border-bottom-color: #1e293b;
  color: #cbd5e1;
}

.slide-card.invert blockquote {
  background-color: #1e293b;
  border-left-color: #3b82f6;
  color: #94a3b8;
}

.slide-card input[type="checkbox"] {
  accent-color: #2563eb;
}

.slide-card.invert input[type="checkbox"] {
  accent-color: #60a5fa;
}




  </style>
</head>
<body>
  <div id="goslide-stage" class="goslide-stage">
    <div id="goslide-deck" class="goslide-deck">
      
      <section class="slide-card two-cols layout-two-cols  active"
               data-slide="1"
               
               style="">
        
        <div class="slide-header slide-tracker"></div>
        
        <div class="slide-title-box"><h2 id="architecture-comparison">Architecture Comparison</h2>
</div>
        
        <div class="slide-body slide-content-box">
          
          <div class="two-cols">
            <div class="col-left"><h3 id="monolithic-approach">Monolithic Approach</h3>
<ul>
<li>Single codebase</li>
<li>Shared dependencies</li>
<li>High coupling</li>
<li>Slower build pipeline</li>
</ul>
</div>
            <div class="col-right"><h3 id="modular-go-pipeline">Modular Go Pipeline</h3>
<ul>
<li>Decoupled packages</li>
<li>Zero-dep IR model</li>
<li>Sub-millisecond build</li>
<li>Deterministic rendering</li>
</ul>
</div>
          </div>
          
        </div>
        <div class="slide-footer"><span></span><span>1</span></div>
        
      </section>
      
    </div>
  </div>

      const curBox = document.getElementById('p-cur-frame');
      const nextBox = document.getElementById('p-next-frame');
      [curBox, nextBox].forEach(box => {
        if (!box) return;
        const slide = box.querySelector('.slide-card');
        if (!slide) return;
        const scale = Math.min((box.clientWidth - 16) / 1920, (box.clientHeight - 16) / 1080);
        slide.style.transform = 'translate(-50%, -50%) scale(' + Math.max(0.1, scale) + ')';
      });
    }

    window.addEventListener('resize', scaleFrames);

    function render() {
      document.getElementById('p-counter').textContent = (curIdx + 1) + ' / ' + total;
      document.getElementById('p-cur-num').textContent = 'Slide ' + (curIdx + 1);
      if (sData[curIdx]) {
        document.getElementById('p-notes').textContent = sData[curIdx].notes;
        document.getElementById('p-cur-frame').innerHTML = sData[curIdx].html;
      }
      if (curIdx + 1 < total) {
        document.getElementById('p-next-num').textContent = 'Slide ' + (curIdx + 2);
        document.getElementById('p-next-frame').innerHTML = sData[curIdx + 1].html;
      } else {
        document.getElementById('p-next-num').textContent = '마지막 장';
        document.getElementById('p-next-frame').innerHTML = '<div style="color:#64748b;font-size:1.1rem;display:flex;height:100%;align-items:center;justify-content:center;">다음 슬라이드가 없습니다.</div>';
      }
      requestAnimationFrame(scaleFrames);
    }

    document.getElementById('p-prev').onclick = () => ch.postMessage({ type: 'NAV_PREV' });
    document.getElementById('p-next').onclick = () => ch.postMessage({ type: 'NAV_NEXT' });
    window.onkeydown = (e) => {
      if (['ArrowRight',' ','PageDown'].includes(e.key)) ch.postMessage({ type: 'NAV_NEXT' });
      if (['ArrowLeft','PageUp'].includes(e.key)) ch.postMessage({ type: 'NAV_PREV' });
    };
    ch.postMessage({ type: 'REQUEST_INIT' });
